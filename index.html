<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TaskCoin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0b1118;
    color:#fff;
    font-family:Arial,sans-serif;
}

button{
    border:0;
    border-radius:14px;
    padding:14px 16px;
    font-size:16px;
    color:#fff;
    cursor:pointer;
}

.app{
    max-width:520px;
    margin:auto;
    padding:18px 14px 90px;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.logo{
    font-size:24px;
    font-weight:700;
}

.user-mini{
    font-size:13px;
    color:#9aa7b5;
    text-align:right;
}

.card{
    background:#111821;
    border:1px solid #263242;
    border-radius:20px;
    padding:18px;
    margin-bottom:14px;
}

.balance{
    text-align:center;
    background:linear-gradient(145deg,#172332,#101720);
}

.balance-title{
    color:#9aa7b5;
    font-size:14px;
}

.balance-value{
    font-size:42px;
    font-weight:700;
    margin:8px 0;
}

.tc{
    color:#f5c451;
}

.nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#101720;
    border-top:1px solid #263242;
    display:flex;
    justify-content:center;
    gap:8px;
    padding:10px;
    z-index:100;
}

.nav button{
    background:#202936;
    padding:11px 16px;
    font-size:14px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.task{
    background:#111821;
    border:1px solid #263242;
    border-radius:18px;
    padding:16px;
    margin-bottom:12px;
}

.task h3{
    margin:0 0 8px;
}

.task p{
    color:#9aa7b5;
    margin:0 0 12px;
    line-height:1.4;
}

.reward{
    color:#f5c451;
    font-weight:700;
    margin-bottom:12px;
}

.task button{
    width:100%;
    margin-top:8px;
}

.primary{
    background:#229ED9;
}

.green{
    background:#19a974;
}

.dark{
    background:#202936;
}

.orange{
    background:#f5a623;
}

.small{
    font-size:13px;
    color:#9aa7b5;
}

.muted{
    color:#9aa7b5;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    padding:18px;
}

.modal-box{
    width:100%;
    max-width:420px;
    background:#111821;
    border:1px solid #263242;
    border-radius:20px;
    padding:20px;
    text-align:center;
}

input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #344254;
    background:#0b1118;
    color:#fff;
    font-size:16px;
    margin:8px 0 12px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #263242;
}

.info-row:last-child{
    border-bottom:0;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
    <div class="logo">🪙 TaskCoin</div>
    <div class="user-mini" id="miniUser">Telegram</div>
</div>

<!-- ГЛАВНАЯ -->
<section id="home" class="page active">

    <div class="card balance">

        <div class="balance-title">
            Твой баланс
        </div>

        <div class="balance-value">
            <span id="balance">185</span>
            <span class="tc">TC</span>
        </div>

        <div class="small" id="completedInfo">
            Выполнено заданий: 4
        </div>

    </div>

    <button
        class="primary"
        style="width:100%;margin-bottom:10px"
        onclick="showPage('tasks')">
        🚀 Зарабатывать TC
    </button>

    <button
        class="dark"
        style="width:100%;margin-bottom:10px"
        onclick="openWithdraw()">
        💸 Вывести TC
    </button>

    <button
        class="orange"
        style="width:100%"
        onclick="openShop()">
        🛒 Магазин TC
    </button>

    <div
        class="card"
        style="margin-top:14px">

        <h3>Как это работает?</h3>

        <p class="muted">
            Выполняй задания, получай TC
            и используй виртуальные монеты
            внутри игры.
        </p>

    </div>

</section>


<!-- ЗАДАНИЯ -->
<section id="tasks" class="page">

    <div class="card">

        <h2 style="margin-top:0">
            🎯 Задания
        </h2>

        <p class="muted">
            Выполняй задания и получай TC.
        </p>

    </div>

    <div id="taskList"></div>

</section>


<!-- ПРОФИЛЬ -->
<section id="profile" class="page">

    <div class="card">

        <h2 style="margin-top:0">
            👤 Профиль
        </h2>

        <div class="info-row">
            <span>Имя</span>
            <b id="profileName">—</b>
        </div>

        <div class="info-row">
            <span>Username</span>
            <b id="profileUsername">—</b>
        </div>

        <div class="info-row">
            <span>Telegram ID</span>
            <b id="profileId">—</b>
        </div>

        <div class="info-row">
            <span>Баланс</span>
            <b>
                <span id="profileBalance">185</span> TC
            </b>
        </div>

        <div class="info-row">
            <span>Заданий выполнено</span>
            <b id="profileTasks">4</b>
        </div>

    </div>

</section>

</div>


<!-- НИЖНЕЕ МЕНЮ -->
<div class="nav">

    <button onclick="showPage('home')">
        🏠 Главная
    </button>

    <button onclick="showPage('tasks')">
        🎯 Задания
    </button>

    <button onclick="showPage('profile')">
        👤 Профиль
    </button>

</div>


<script>

const tg =
    window.Telegram &&
    window.Telegram.WebApp;

if(tg){

    tg.ready();

    tg.expand();

}


let telegramUser =
    (tg &&
     tg.initDataUnsafe &&
     tg.initDataUnsafe.user)
    || null;


const storageKey =
    telegramUser
    ? "taskcoin_" + telegramUser.id
    : "taskcoin_guest";


let saved = {};

try{

    saved =
        JSON.parse(
            localStorage.getItem(storageKey)
            || "{}"
        );

}catch(e){

    saved = {};

}


let balance =
    Number.isFinite(saved.balance)
    ? saved.balance
    : 185;


let completed =
    Array.isArray(saved.completed)
    ? saved.completed
    : [1,2,3,4];



/* =========================
   ЗАДАНИЯ
========================= */

const tasks = [

    {
        id:1,
        name:"🎯 Первое задание",
        description:"Выполни первое задание TaskCoin.",
        reward:10
    },

    {
        id:2,
        name:"🚀 Активный пользователь",
        description:"Покажи активность в TaskCoin.",
        reward:25
    },

    {
        id:3,
        name:"💎 TaskCoin Hunter",
        description:"Собери ещё немного TC.",
        reward:50
    },

    {
        id:4,
        name:"🔥 Большое задание",
        description:"Выполни большое задание и получи награду.",
        reward:100
    },

    {
        id:5,
        name:"📢 Подпишись на нашу группу",
        description:"Подпишись на нашу группу.",
        reward:300,
        link:"https://t.me/+u5JoD3QrlK01NGRi"
    }

];



/* =========================
   СОХРАНЕНИЕ
========================= */

function saveData(){

    localStorage.setItem(
        storageKey,
        JSON.stringify({
            balance,
            completed
        })
    );

}



/* =========================
   ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ
========================= */

function showPage(id){

    document
        .querySelectorAll('.page')
        .forEach(
            p => p.classList.remove('active')
        );

    const page =
        document.getElementById(id);

    if(page){

        page.classList.add('active');

    }

    if(id === 'tasks'){

        renderTasks();

    }

    updateUI();

    window.scrollTo(0,0);

}



/* =========================
   ПОКАЗ ЗАДАНИЙ
========================= */

function renderTasks(){

    const list =
        document.getElementById('taskList');

    list.innerHTML = '';

    tasks.forEach(task => {

        const done =
            completed.includes(task.id);

        const div =
            document.createElement('div');

        div.className = 'task';


        div.innerHTML = `

            <h3>
                ${task.name}
            </h3>

            <div class="reward">
                +${task.reward} TC
            </div>

            <p>
                ${task.description}
            </p>

            ${
                task.link
                ?
                `
                <button
                    class="primary"
                    onclick="openTaskLink('${task.link}')">
                    📢 Подписаться на группу
                </button>
                `
                :
                ''
            }

            <button
                class="${done ? 'dark' : 'green'}"
                ${done ? 'disabled' : ''}
                onclick="completeTask(${task.id})">

                ${
                    done
                    ? '✅ Выполнено'
                    : '🎁 Получить награду'
                }

            </button>

        `;

        list.appendChild(div);

    });

}



/* =========================
   ОТКРЫТЬ ГРУППУ
========================= */

function openTaskLink(link){

    if(
        tg &&
        tg.openTelegramLink
    ){

        tg.openTelegramLink(link);

    }else{

        window.open(
            link,
            '_blank'
        );

    }

}



/* =========================
   ВЫПОЛНИТЬ ЗАДАНИЕ
========================= */

function completeTask(id){

    if(
        completed.includes(id)
    ){

        alert(
            'Это задание уже выполнено.'
        );

        return;

    }


    const task =
        tasks.find(
            t => t.id === id
        );

    if(!task){

        return;

    }


    completed.push(id);

    balance += task.reward;

    saveData();

    renderTasks();

    updateUI();


    alert(
        '🎉 Задание выполнено!\n\n+' +
        task.reward +
        ' TC'
    );

}



/* =========================
   ОБНОВЛЕНИЕ ИНТЕРФЕЙСА
========================= */

function updateUI(){

    document.getElementById(
        'balance'
    ).textContent = balance;


    document.getElementById(
        'profileBalance'
    ).textContent = balance;


    document.getElementById(
        'profileTasks'
    ).textContent =
        completed.length;


    document.getElementById(
        'completedInfo'
    ).textContent =
        'Выполнено заданий: ' +
        completed.length;


    const name =
        telegramUser
        ?
        [
            telegramUser.first_name,
            telegramUser.last_name
        ]
        .filter(Boolean)
        .join(' ')
        :
        'Гость';


    const username =
        telegramUser &&
        telegramUser.username
        ?
        '@' + telegramUser.username
        :
        '—';


    document.getElementById(
        'miniUser'
    ).textContent = name;


    document.getElementById(
        'profileName'
    ).textContent = name;


    document.getElementById(
        'profileUsername'
    ).textContent = username;


    document.getElementById(
        'profileId'
    ).textContent =
        telegramUser
        ?
        telegramUser.id
        :
        '—';

}



/* =========================
   ВЫВОД TC
========================= */

function openWithdraw(){

    const modal =
        document.createElement('div');

    modal.className = 'modal';

    modal.id = 'withdrawModal';


    modal.innerHTML = `

        <div class="modal-box">

            <h2>
                💸 Вывод TC
            </h2>

            <p class="muted">
                Доступно:
                <b style="color:#f5c451">
                    ${balance} TC
                </b>
            </p>


            <input
                id="withdrawAmount"
                type="number"
                min="10000"
                placeholder="Например: 10000"
            >


            <div class="small">
                🔒 Минимальный вывод: 10000 TC
            </div>


            <button
                class="primary"
                style="width:100%;margin-top:14px"
                onclick="sendWithdraw()">

                Создать заявку

            </button>


            <button
                class="dark"
                style="width:100%;margin-top:8px"
                onclick="closeModal('withdrawModal')">

                Закрыть

            </button>

        </div>

    `;


    document.body.appendChild(modal);

}



/* =========================
   СОЗДАНИЕ ЗАЯВКИ
========================= */

function sendWithdraw(){

    const amount =
        Number(
            document.getElementById(
                'withdrawAmount'
            ).value
        );


    if(
        !amount ||
        amount < 10000
    ){

        alert(
            'Минимальная сумма вывода — 10000 TC'
        );

        return;

    }


    if(amount > balance){

        alert(
            'Недостаточно TC на балансе.'
        );

        return;

    }


    document
        .getElementById(
            'withdrawModal'
        )
        .querySelector(
            '.modal-box'
        )
        .innerHTML = `

            <h2>
                ✅ Заявка создана
            </h2>

            <p>
                Сумма:
                <b style="color:#f5c451">
                    ${amount} TC
                </b>
            </p>

            <p class="muted">
                Статус: ожидает обработки
            </p>

            <button
                class="dark"
                style="width:100%;margin-top:12px"
                onclick="closeModal('withdrawModal')">

                Закрыть

            </button>

        `;

}



/* =========================
   МАГАЗИН TC
========================= */

function openShop(){

    const shop =
        document.createElement('div');

    shop.className = 'modal';

    shop.id = 'shopModal';


    shop.innerHTML = `

        <div class="modal-box">

            <h2>
                🛒 Магазин TC
            </h2>

            <p class="muted">
                Покупка виртуальных TC
            </p>


            <button
                class="primary"
                style="width:100%;margin:8px 0"
                onclick="buyTC(1000)">

                1000 TC — ⭐ 10

            </button>


            <button
                class="primary"
                style="width:100%;margin:8px 0"
                onclick="buyTC(5000)">

                5000 TC — ⭐ 40

            </button>


            <button
                class="primary"
                style="width:100%;margin:8px 0"
                onclick="buyTC(15000)">

                15000 TC — ⭐ 100

            </button>


            <button
                class="dark"
                style="width:100%;margin-top:12px"
                onclick="closeModal('shopModal')">

                Закрыть

            </button>

        </div>

    `;


    document.body.appendChild(shop);

}



/* =========================
   ПОКУПКА TC
========================= */

function buyTC(amount){

    alert(
        'Вы выбрали ' +
        amount +
        ' TC.\n\n' +
        '⭐ Реальная оплата Telegram Stars ' +
        'будет подключена после добавления ' +
        'серверной части.'
    );

}



/* =========================
   ЗАКРЫТИЕ ОКНА
========================= */

function closeModal(id){

    const el =
        document.getElementById(id);

    if(el){

        el.remove();

    }

}



/* =========================
   ЗАПУСК
========================= */

updateUI();

renderTasks();

</script>

</body>
</html>
